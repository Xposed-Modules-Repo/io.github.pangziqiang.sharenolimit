plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mishare_nolimit'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mishare_nolimit"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
