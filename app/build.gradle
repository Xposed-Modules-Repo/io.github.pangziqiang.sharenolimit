plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.pangziqiang.misharenolimit'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.pangziqiang.misharenolimit"
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
